<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texto en pestaña</title>
    <link rel="stylesheet" href="./tailwindcss.css">
</head>
<body class="bg-gray-100">
    <header class="bg-blue-500 text-white p-4 text-center text-2x1 font-bold">
        Mi Página con Tailwind
    </header>
    <section class="container mx-auto p-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-6 rounded-1g shadow-1g">
                <h2 class="text-xl font-bold">Sección 1</h2>
                <p class="text-gray-700">Descripción de la sección.</p>
            </div>
            <div class="bg-white p-6 rounded-1g shadow-1g">
                <h2 class="text-x1 font-bold">Sección 2</h2>
                <p class="text-gray-700">Descripción de la sección.</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-lg">
                <h2 class="text-x1 font-bold">Sección 3</h2>
                <p class="text-gray-700">Descripción de la sección.</p>
            </div>
        </div>
    </section>
    <footer class="bg-gray-800 text-white text-center p-4">
        2025 - Mi Web Tailwind
    </footer>
</body>
</html>
